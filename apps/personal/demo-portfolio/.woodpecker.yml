# demo-portfolio CI/CD 流水线
pipeline:
  test:
    image: pandora-shared/hyperf:latest
    commands:
      - cd backend-hyperf && composer install --no-dev
      - echo "Run unit tests..."

  build:
    image: docker:dind
    commands:
      - docker build -t demo-portfolio-backend:$$CI_COMMIT_SHA ./backend-hyperf

  deploy:
    image: docker:cli
    commands:
      - docker compose -f apps/personal/demo-portfolio/docker-compose.yml up -d --force-recreate

branches:
  include: [main, master]
