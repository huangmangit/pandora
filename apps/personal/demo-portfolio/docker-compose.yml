services:
  demo-portfolio-frontend:
    build:
      context: ./frontend
    container_name: demo-portfolio-frontend
    restart: always
    networks:
      - 1panel-network

  demo-portfolio-backend:
    build:
      context: ./backend-hyperf
    container_name: demo-portfolio-backend
    restart: always
    volumes:
      - ./backend-hyperf:/var/www/html
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
