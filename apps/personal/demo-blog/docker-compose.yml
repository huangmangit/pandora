services:
  demo-blog-frontend:
    build:
      context: ./frontend
    container_name: demo-blog-frontend
    restart: always
    networks:
      - pandora-net

  demo-blog-backend:
    build:
      context: ./backend-yii
    container_name: demo-blog-backend
    restart: always
    volumes:
      - ./backend-yii:/var/www/html
    networks:
      - pandora-net

networks:
  pandora-net:
    external: true
