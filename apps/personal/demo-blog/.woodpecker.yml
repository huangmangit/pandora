# demo-blog CI/CD 流水线
pipeline:
  test:
    image: pandora-shared/php-fpm:latest
    commands:
      - cd backend-yii && composer install --no-dev
      - echo "Run unit tests..."

  build:
    image: docker:dind
    commands:
      - docker build -t demo-blog-backend:$$CI_COMMIT_SHA ./backend-yii

  deploy:
    image: docker:cli
    commands:
      - docker compose -f apps/personal/demo-blog/docker-compose.yml up -d --force-recreate

branches:
  include: [main, master]
