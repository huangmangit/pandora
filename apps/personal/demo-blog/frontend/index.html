<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Demo Blog - 个人博客</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 48px 40px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; max-width: 480px; }
        h1 { color: #1a1a2e; margin-bottom: 12px; font-size: 28px; }
        .badge { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; }
        p { color: #666; line-height: 1.8; font-size: 14px; }
        .info { margin-top: 24px; padding: 16px; background: #f8f9fa; border-radius: 8px; font-size: 13px; color: #888; }
        .info span { display: block; margin: 4px 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">personal / demo-blog</div>
        <h1>📝 Demo Blog</h1>
        <p>个人博客 — Yii2 FPM 前后端分离 Demo</p>
        <div class="info">
            <span>前端: Nginx Alpine (静态)</span>
            <span>后端: PHP-FPM 8.1 (Yii2)</span>
            <span>网关反代: / → frontend:80 | /api → backend:9000</span>
        </div>
    </div>
</body>
</html>
