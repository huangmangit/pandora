<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Demo Admin - A公司后台管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #16213e; padding: 48px 40px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.3); text-align: center; max-width: 480px; border: 1px solid #0f3460; }
        h1 { color: #e94560; margin-bottom: 12px; font-size: 28px; }
        .badge { display: inline-block; background: #0f3460; color: #53a8b6; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; }
        p { color: #a0aec0; line-height: 1.8; font-size: 14px; }
        .info { margin-top: 24px; padding: 16px; background: #0f3460; border-radius: 8px; font-size: 13px; color: #718096; }
        .info span { display: block; margin: 4px 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">company-a / demo-admin</div>
        <h1>⚙️ Demo Admin</h1>
        <p>A公司后台管理系统 — Yii2 FPM 前后端分离 Demo</p>
        <div class="info">
            <span>前端: Nginx Alpine (静态)</span>
            <span>后端: PHP-FPM 8.1 (Yii2)</span>
            <span>网关反代: / → frontend:80 | /api → backend:9000</span>
        </div>
    </div>
</body>
</html>
