version: "3.8"

services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:latest
    container_name: pandora-woodpecker-server
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    env_file:
      - ../.env
    environment:
      WOODPECKER_HOST: ${WOODPECKER_HOST}
      WOODPECKER_GITEA_URL: ${WOODPECKER_GITEA_URL}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN}
    networks:
      - 1panel-network

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:latest
    container_name: pandora-woodpecker-agent
    restart: always
    depends_on:
      - woodpecker-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ../.env
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

volumes:
  woodpecker-data:
