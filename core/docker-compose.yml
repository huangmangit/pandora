services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf.d:/etc/mysql/conf.d
      - ./mysql/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pandora-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pandora-net

  openresty:
    image: uusec/openresty-manager:2.4.2
    container_name: openresty
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "${OPENRESTY_MANAGER_PORT:-8808}:34567"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ../apps:/var/www/apps:ro
      - ./openresty/acme:/opt/om/acme
      - ./openresty/data:/opt/om/data
      - ./openresty/conf:/opt/om/nginx/conf
    networks:
      - pandora-net

  php74:
    build:
      context: .
      dockerfile: Dockerfile.php74
    container_name: php74
    restart: always
    volumes:
      - ../apps:/var/www/apps:ro
    networks:
      - pandora-net

  php83:
    build:
      context: .
      dockerfile: Dockerfile.php83
    container_name: php83
    restart: always
    volumes:
      - ../apps:/var/www/apps:ro
    networks:
      - pandora-net

  dpanel:
    image: dpanel/dpanel:latest
    container_name: dpanel
    restart: always
    ports:
      - "${DPANEL_PORT:-8807}:8080"
    environment:
      APP_NAME: dpanel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dpanel-data:/dpanel
    networks:
      - pandora-net


  woodpecker-server:
    image: woodpeckerci/woodpecker-server:latest
    container_name: woodpecker-server
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    environment:
      WOODPECKER_HOST: ${WOODPECKER_HOST}
      WOODPECKER_GITEA_URL: ${WOODPECKER_GITEA_URL}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN}
    networks:
      - pandora-net

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:latest
    container_name: woodpecker-agent
    restart: always
    depends_on:
      - woodpecker-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
    networks:
      - pandora-net

networks:
  pandora-net:
    external: true

volumes:
  mysql-data:
  redis-data:
  woodpecker-data:
  dpanel-data:
