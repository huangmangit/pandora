services:
  mysql:
    image: mariadb:latest
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf.d:/etc/mysql/conf.d
      - ./mysql/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci 
      --skip-log-bin
      --max-connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pandora-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pandora-net

  openresty:
    image: uusec/openresty-manager:latest
    container_name: openresty
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "${OPENRESTY_MANAGER_PORT:-8808}:34567"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ../apps:/var/www/apps:ro
      - ./openresty/acme:/opt/om/acme
      - ./openresty/data:/opt/om/data
      - ./openresty/conf:/opt/om/nginx/conf
    networks:
      - pandora-net

  php74:
    build:
      context: .
      dockerfile: Dockerfile.php74
    container_name: php74
    restart: always
    volumes:
      - ../apps:/var/www/apps:ro
    networks:
      - pandora-net

  php83:
    build:
      context: .
      dockerfile: Dockerfile.php83
    container_name: php83
    restart: always
    volumes:
      - ../apps:/var/www/apps:ro
    networks:
      - pandora-net

  dpanel:
    image: dpanel/dpanel:latest
    container_name: dpanel
    restart: always
    ports:
      - "${DPANEL_PORT:-8807}:8080"
    environment:
      APP_NAME: dpanel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dpanel-data:/dpanel
    networks:
      - pandora-net


  woodpecker-server:
    image: woodpeckerci/woodpecker-server:latest
    container_name: woodpecker-server
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    environment:
       # ⚠️ 必须：你的外部访问地址 (例如 https://ci.yourdomain.com 或 http://公网IP:8000)
      WOODPECKER_HOST: ${WOODPECKER_HOST}
      
      # ⚠️ 必须：Agent 连接 Server 的密钥 (随便生成一个长字符串)
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      
      # ⚠️ 必须：指定第一次登录时自动成为管理员的 GitHub 用户名
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN} 

      # ==========================================
      # 🚀 GitHub OAuth 专属配置 (替换原来的 Gitea)
      # ==========================================
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET}
      # 注意：如果是公共 GitHub，不需要配 WOODPECKER_GITHUB_URL。如果是 GitHub Enterprise 才需要。
    networks:
      - pandora-net

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:latest
    container_name: woodpecker-agent
    restart: always
    depends_on:
      - woodpecker-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
    networks:
      - pandora-net

networks:
  pandora-net:
    external: true

volumes:
  mysql-data:
  redis-data:
  woodpecker-data:
  dpanel-data:
