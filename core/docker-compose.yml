services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTP_PORT:-80}:80/udp"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ../apps:/var/www/apps
    networks:
      - 1panel-network
      - pandora-net
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 10s
      timeout: 5s
      retries: 3

  php74:
    build:
      context: .
      dockerfile: Dockerfile.php74
    container_name: php74
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ../apps:/var/www/apps
      - ./php/conf.d/zzz-listen.conf:/usr/local/etc/php-fpm.d/zzz-listen.conf:ro
      - ./php/conf.d/zzz-timezone.ini:/usr/local/etc/php/conf.d/zzz-timezone.ini:ro
    networks:
      - pandora-net
      - 1panel-network

  php83:
    build:
      context: .
      dockerfile: Dockerfile.php83
    container_name: php83
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ../apps:/var/www/apps
      - ./php/conf.d/zzz-listen.conf:/usr/local/etc/php-fpm.d/zzz-listen.conf:ro
      - ./php/conf.d/zzz-timezone.ini:/usr/local/etc/php/conf.d/zzz-timezone.ini:ro
    networks:
      - pandora-net
      - 1panel-network

  mysql:
    image: mariadb:11.8
    container_name: mysql
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf.d:/etc/mysql/conf.d
      - ./mysql/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci 
      --skip-log-bin
      --max-connections=500
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 1panel-network

  redis:
    image: redis:8.8.1
    container_name: redis
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 1panel-network

  dpanel:
    image: dpanel/dpanel:1.10.6
    container_name: dpanel
    restart: always
    ports:
      - "${DPANEL_PORT:-8807}:8080"
    environment:
      APP_NAME: dpanel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dpanel-data:/dpanel
    networks:
      - 1panel-network

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.16.0
    container_name: woodpecker-server
    restart: always
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    environment:
      # ⚠️ 必须：你的外部访问地址 (例如 https://ci.yourdomain.com 或 http://公网IP:8000)
      WOODPECKER_HOST: ${WOODPECKER_HOST}

      # ⚠️ 必须：Agent 连接 Server 的密钥 (随便生成一个长字符串)
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}

      # ⚠️ 必须：指定第一次登录时自动成为管理员的 GitHub 用户名
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN}

      # ==========================================
      # 🚀 GitHub OAuth 专属配置 (替换原来的 Gitea)
      # ==========================================
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET}
      # 注意：如果是公共 GitHub，不需要配 WOODPECKER_GITHUB_URL。如果是 GitHub Enterprise 才需要。
    networks:
      - 1panel-network

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.16.0
    container_name: woodpecker-agent
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./woodpecker/agent-data:/etc/woodpecker
    environment:
      WOODPECKER_SERVER: ${WOODPECKER_SERVER}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_MAX_PROCS: 2
      # 新增这一行！给这台机器打上唯一的身份标签
      WOODPECKER_FILTER_LABELS: "node=${WOODPECKER_AGENT_LABEL}" 
    networks:
      - 1panel-network
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      # DOMAIN: "https://vaultwarden.example.com" # 使用反向代理时必填；您的域名；Vaultwarden 需要知道它是 https 才能正确处理附件
      SIGNUPS_ALLOWED: "true" # 创建账户后，使用 "false" 停用此选项，这样就不会有陌生人注册了
    volumes:
      - ./vaultwarden:/data # : 前面的路径可以修改
    ports:
      - 11001:80 # 您可以将 11001 替换为您喜欢的端口
    networks:
      - 1panel-network
networks:
  1panel-network:
    external: true
  pandora-net:
    external: true

volumes:
  mysql-data:
  redis-data:
  woodpecker-data:
  dpanel-data:
